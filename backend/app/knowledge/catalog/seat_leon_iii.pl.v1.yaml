    verdict: inspect
    confidence: medium
    dealer_rationale: [Сильная конфигурация, но решение зависит от состояния конкретной коробки]
    required_checks: [полный тест DSG, история обслуживания, диагностика ошибок]
    reject_if: [рывки или задержки DSG, аварийный режим, нет истории]

slug: seat-leon-iii-pl-v1
make: SEAT
model: Leon
generation: III
market_code: PL
production_years: "2012–2020"
version: knowledge.seat-leon-iii.pl.v1
verification_status: draft
summary: Стартовая проверенная карта Leon III для закупки в Польше. Профиль опирается на независимый отчёт ADAC по бензиновым версиям; дизельные и спортивные модификации требуют отдельной редакционной проверки.
body_types: [SC, "5-door", ST, X-PERIENCE]
powertrains:
  - name: 1.4 TSI
    fuel: petrol
    transmissions: [manual, DSG]
    verdict: recommended
    evidence_refs: [adac-leon-petrol]
    review_note: ADAC выделяет 1.4 TSI мощностью 122–150 л.с. как наиболее удачный баланс динамики и расхода; точный индекс двигателя и историю обслуживания всё равно сверять.
  - name: 1.8 TSI
    fuel: petrol
    transmissions: [manual, DSG]
    verdict: caution
    evidence_refs: [adac-leon-petrol]
    review_note: Версия заметно динамичнее, но ADAC отмечает более высокую цену покупки и меньшую распространённость; покупать только после проверки конкретного экземпляра.
  - name: Cupra 2.0 TSI
    fuel: petrol
    transmissions: [manual, DSG]
    performance: true
    verdict: unreviewed
    evidence_refs: [adac-leon-petrol]
    review_note: Спортивная версия требует отдельной оценки истории, доработок и ликвидности; этот профиль не даёт автоматической рекомендации.
gearbox_profiles:
  - name: DSG
    variants: ["6-ступенчатая", "7-ступенчатая"]
    identification_rule: Уточнить код коробки и интервал её обслуживания по VIN и документам.
    suitable_for: Только после дорожной проверки и подтверждённой сервисной истории.
    inspection_checks: [плавность трогания, переключения на холодную и после прогрева, режимы D/R, ошибки блока]
    risk_signals: [рывки при старте, задержка включения передачи, аварийный режим]
    evidence_refs: [adac-leon-petrol]
    evidence_status: reviewed_with_limits
known_issues:
  - component: Подвеска
    applicability: Leon III в целом
    classification: confirmed_model_level
    severity: medium
    symptoms: [стуки, ухудшение устойчивости, неравномерный износ шин]
    inspection: [осмотр пружин и амортизаторов на подъёмнике, короткий тест-драйв]
    evidence_refs: [adac-leon-petrol]
    note: В отчёте ADAC элементы подвески отмечены среди зон, которые могут влиять на результат технического осмотра.

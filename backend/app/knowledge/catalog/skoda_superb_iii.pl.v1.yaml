  - name: DSG
    variants: ["6-ступенчатая", "7-ступенчатая"]
    identification_rule: Зафиксировать код коробки по VIN и наличие подтверждённого обслуживания.
    suitable_for: Допустима для закупки после дорожной проверки, диагностики и проверки истории.
    inspection_checks: [плавность трогания, переключения на холодную и после прогрева, режимы D/R, ошибки блока]
    risk_signals: [рывки, задержки включения, аварийный режим, отсутствие истории]
    evidence_refs: [adac-superb-diesel]
    evidence_status: reviewed_with_limits
known_issues:
  - component: Пробег и следы интенсивной эксплуатации
    applicability: Superb III в целом
    classification: inspection_risk
    severity: high
    symptoms: [изношенный салон, люфты подвески, неравномерный износ шин, неполная история]
    inspection: [сверка истории, осмотр на подъёмнике, диагностика электронных систем, оценка износа салона]
    evidence_refs: [adac-superb-diesel]
    note: ADAC описывает Superb как автомобиль, часто используемый для дальних поездок; поэтому фактический пробег и обслуживание важнее среднего ожидания от модели.

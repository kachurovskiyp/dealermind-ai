powertrains:
  - name: 1.6 TDI
    fuel: diesel
    transmissions: [manual, DSG]
    verdict: caution
    evidence_refs: [adac-superb-diesel]
    review_note: ADAC считает 120-сильную версию достаточной, но не самой уверенной для крупного Superb; решение принимать после проверки нагрузки и истории.
  - name: 2.0 TDI
    fuel: diesel
    transmissions: [manual, DSG]
    drivetrains: [FWD, 4x4]
    verdict: recommended
    evidence_refs: [adac-superb-diesel]
    review_note: ADAC рекомендует 2.0 TDI 150 л.с. и считает 190 л.с. вариантом с большим запасом тяги; всё равно проверять экологические системы и пробег.
